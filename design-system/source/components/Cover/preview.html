<!-- @dsCard height=300 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@600&display=swap">
<style>
  html, body { margin: 0; background: var(--background); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--background); }
  .cover svg { position: absolute; inset: 0; }
  .ink { fill: var(--foreground); }
  .brand { fill: var(--primary); }
  .sky { fill: var(--mark-sky); }
  .tint { fill: var(--border); }
  .cut { fill: var(--background); }
  .blk { rx: var(--radius-xl); }
  .pill { rx: 6px; }
  .text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .name { margin: 0; font: 600 80px/.95 var(--font-sans); letter-spacing: -0.055em; color: var(--foreground); }
  .tag { margin: 16px 0 0; font: 400 14px/20px var(--font-sans); color: var(--muted-foreground); }
</style>
<div class="cover">
  <!--
    blocks: foreground slab 176×300 (x560), primary 208×176 bleeding top-right, mark-sky 120×108 and border tint 72×108 bleeding bottom-right; corners radius-xl.
    arrangement: one tall ink slab with three satellites stacked to its right, all right of x=480, bleeding top, right and bottom.
    pattern: literal motif — the Y mark is round-capped bars at ±45° meeting at a hub, so six 12px pills (radius-full, half of space-3) cut from background at ±45°, plus one mark-sky hub disc.
    scales: pill width space-3 (12), pitch space-8 (32) along the diagonal, gaps space-4 (16), radii radius-xl and radius-full.
  -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect class="ink blk" x="560" y="-20" width="176" height="340"/>
    <rect class="brand blk" x="752" y="-20" width="228" height="196"/>
    <rect class="sky blk" x="752" y="192" width="120" height="128"/>
    <rect class="tint blk" x="888" y="192" width="92" height="128"/>
    <rect class="cut pill" x="642" y="40" width="12" height="120" transform="rotate(-45 648 100)"/>
    <rect class="cut pill" x="642" y="112" width="12" height="120" transform="rotate(-45 648 172)"/>
    <rect class="cut pill" x="642" y="184" width="12" height="120" transform="rotate(-45 648 244)"/>
    <rect class="cut pill" x="814" y="4" width="12" height="96" transform="rotate(45 820 52)"/>
    <rect class="cut pill" x="850" y="40" width="12" height="96" transform="rotate(45 856 88)"/>
    <rect class="cut pill" x="886" y="76" width="12" height="96" transform="rotate(45 892 124)"/>
    <circle class="sky" cx="744" cy="184" r="28"/>
    <circle class="cut" cx="744" cy="184" r="5"/>
  </svg>
  <div class="text">
    <h1 class="name">Yorkstead<br>Systems</h1>
    <p class="tag">Your business. Your workflow. Your software.</p>
  </div>
</div>
