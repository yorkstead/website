name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_command_center_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_command_center_test
      MIGRATION_DATABASE_DRIVER: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_command_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_command_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=critical

      - name: Validate migration plan
        run: bun run db:migrate:check

      - name: Apply migrations to disposable PostgreSQL
        run: |
          bun run db:migrate
          bun run db:migrate

      - name: Run deterministic and database integration tests
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Install browser runtime
        run: bunx playwright install --with-deps chromium

      - name: Run browser tests
        run: bun run test:e2e

      - name: Build without production runtime secrets
        run: bun run build

      - name: Verify generated worktree remains clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff --check
            git diff
            exit 1
          fi

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
