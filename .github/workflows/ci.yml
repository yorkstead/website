name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_command_center_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_command_center_test
      MIGRATION_DATABASE_DRIVER: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_command_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_command_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate Yorkstead project scaffold
        run: bun run yorkstead:check

      - name: Audit dependencies
        run: bun audit --audit-level=critical

      - name: Validate migration plan
        run: bun run db:migrate:check

      - name: Apply migrations to disposable PostgreSQL
        run: |
          bun run db:migrate
          bun run db:migrate

      - name: Prepare Better Auth schema in disposable PostgreSQL
        run: bun run auth:migrate

      - name: Run deterministic and database integration tests
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Install browser runtime
        run: bunx playwright install --with-deps chromium

      - name: Run browser tests
        run: bun run test:e2e

      - name: Verify YS-SYS-001 Registry browser workflow
        run: bunx playwright test -c playwright.ys-sys-001.config.ts

      - name: Verify isolated customer enrollment browser flow
        env:
          NODE_ENV: development
          CUSTOMER_ENROLLMENT_DISPOSABLE: enabled
        run: bunx playwright test -c playwright.cc007.config.ts

      - name: Verify owner publishing browser workflow
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc009.config.ts

      - name: Verify isolated Client Access browser workflow
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc010.config.ts

      - name: Verify isolated Portal Readiness workflow
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc011.config.ts

      - name: Verify isolated Customer Communications workflow
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc012.config.ts

      - name: Verify Command Center lead-to-project lifecycle
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc016.config.ts

      - name: Verify Command Center navigation
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc017.config.ts

      - name: Verify Actionable Command Center
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc018.config.ts

      - name: Verify Business Systems Directory
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc023.config.ts

      - name: Verify Opportunity Discovery owner workflow
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc026.config.ts

      - name: Verify authenticated Marketing to CRM handoff
        env:
          NODE_ENV: development
        run: bunx playwright test -c playwright.cc038.config.ts

      - name: Upload Opportunity Discovery responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc026-opportunity-discovery-screenshots
          path: test-results/**/owner-opportunity-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Build without production runtime secrets
        run: bun run build

      - name: Verify generated worktree remains clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff --check
            git diff
            exit 1
          fi

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  recovery-rehearsal:
    name: Isolated synthetic recovery rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create internal network and ephemeral PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create --internal ys-recovery-${GITHUB_RUN_ID}
          test "$(docker network inspect -f '{{.Internal}}' ys-recovery-${GITHUB_RUN_ID})" = true
          db_user="r$(openssl rand -hex 8)"
          db_password="$(openssl rand -hex 32)"
          db_name="recovery_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::${db_user}"
          echo "::add-mask::${db_password}"
          printf 'RECOVERY_DB_USER=%s\nRECOVERY_DB_PASSWORD=%s\nRECOVERY_DB_NAME=%s\nRECOVERY_DOCKER_NETWORK=ys-recovery-%s\n' \
            "$db_user" "$db_password" "$db_name" "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          docker run -d --rm --name ys-recovery-postgres --network "ys-recovery-${GITHUB_RUN_ID}" \
            -e POSTGRES_USER="$db_user" -e POSTGRES_PASSWORD="$db_password" -e POSTGRES_DB="$db_name" postgres:18-alpine
          for attempt in $(seq 1 30); do
            docker exec ys-recovery-postgres pg_isready -U "$db_user" -d "$db_name" && exit 0
            sleep 1
          done
          exit 1
      - name: Build recovery-only test image
        run: docker build --file scripts/recovery/Dockerfile --tag ys-sys-001-recovery:${GITHUB_RUN_ID} .
      - name: Verify only the disposable database is attached
        run: |
          attached="$(docker network inspect -f '{{range $id, $container := .Containers}}{{println $container.Name}}{{end}}' "${RECOVERY_DOCKER_NETWORK}")"
          test "$attached" = "ys-recovery-postgres"
      - name: Run recovery-only entry point
        run: |
          docker run --rm --name ys-recovery-runner --network "${RECOVERY_DOCKER_NETWORK}" --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges --user 10001:10001 \
            --tmpfs /work:rw,noexec,nosuid,nodev,size=512m,mode=700,uid=10001,gid=10001 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=700,uid=10001,gid=10001 \
            -e RECOVERY_DB_HOST=ys-recovery-postgres -e RECOVERY_DB_PORT=5432 \
            -e RECOVERY_DB_USER="${RECOVERY_DB_USER}" -e RECOVERY_DB_PASSWORD="${RECOVERY_DB_PASSWORD}" \
            -e RECOVERY_DB_NAME="${RECOVERY_DB_NAME}" ys-sys-001-recovery:${GITHUB_RUN_ID}
      - name: Remove disposable resources
        if: always()
        run: |
          docker rm -f ys-recovery-postgres 2>/dev/null || true
          docker network rm "ys-recovery-${GITHUB_RUN_ID}" 2>/dev/null || true

  ys-sys-001-application-recovery:
    name: YS-SYS-001 synthetic restored-app readiness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check recovery scripts
        run: |
          bash -n scripts/recovery/application-readiness.sh
          git diff --check
      - name: Verify rehearsal refuses execution outside the isolated job context
        run: |
          if env -i PATH="$PATH" HOME="$HOME" CI=true bash scripts/recovery/application-readiness.sh >/dev/null 2>&1; then
            echo "Rehearsal unexpectedly accepted an untrusted execution context"
            exit 1
          fi
      - name: Restore synthetic PostgreSQL 18 state and test the app
        run: >-
          env -i PATH="$PATH" HOME="$HOME" CI=true GITHUB_ACTIONS=true
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP"
          bash scripts/recovery/application-readiness.sh
      - name: Upload sanitized aggregate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ys-sys-001-application-recovery-report
          path: artifacts/ys-sys-001-application-recovery.json
          if-no-files-found: error
          retention-days: 7

  ys-sys-001-private-rehearsal-synthetic:
    name: YS-SYS-001 private runtime synthetic validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate private rehearsal entry point syntax
        run: bash -n scripts/recovery/run-private-rehearsal.sh
      - name: Verify target-scoped private cleanup safety
        run: python3 -m unittest scripts/recovery/test_private_rehearsal_cleanup.py scripts/recovery/test_private_rehearsal_clock.py
      - name: Validate private runtime setup with synthetic-only PostgreSQL
        env:
          CI: true
          GITHUB_ACTIONS: true
          YS_APP_RECOVERY_SYNTHETIC_VALIDATION: true
          YS_PRIVATE_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bun scripts/recovery/private-rehearsal-synthetic.ts

  ys-sys-001-readonly-role:
    name: YS-SYS-001 synthetic read-only role verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify least-privileged role on disposable PostgreSQL
        env:
          CI: true
        run: scripts/ys-sys-001-readonly-role/test-synthetic.sh
